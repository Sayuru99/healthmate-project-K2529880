<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" font-family="Liberation Sans, Arial" font-size="19">
<rect width="1100" height="430" fill="#fff"/>
<rect x="40" y="40" width="560" height="320" rx="10" fill="#fff" stroke="#00796B" stroke-width="2.5"/><path d="M40,90 h560 v-40 a10,10 0 0 0 -10,-10 h-540 a10,10 0 0 0 -10,10 z" fill="#00796B"/><text x="60" y="73" font-weight="bold" font-size="22" fill="#fff">health_records</text>
<text x="60" y="130" font-weight="bold">PK</text><text x="120" y="130" font-weight="bold">id</text><text x="260" y="130">INTEGER</text><text x="390" y="130" fill="#555">AUTOINCREMENT</text>
<text x="60" y="180" font-weight="bold">IX</text><text x="120" y="180">date</text><text x="260" y="180">TEXT</text><text x="390" y="180" fill="#555">NOT NULL, yyyy-MM-dd</text>
<text x="120" y="230">steps</text><text x="260" y="230">INTEGER</text><text x="390" y="230" fill="#555">default 0, &gt;= 0</text>
<text x="120" y="280">calories</text><text x="260" y="280">INTEGER</text><text x="390" y="280" fill="#555">default 0, &gt;= 0 (kcal)</text>
<text x="120" y="330">water</text><text x="260" y="330">INTEGER</text><text x="390" y="330" fill="#555">default 0, &gt;= 0 (ml)</text>
<g stroke="#B2DFDB"><line x1="40" y1="148" x2="600" y2="148"/><line x1="40" y1="198" x2="600" y2="198"/><line x1="40" y1="248" x2="600" y2="248"/><line x1="40" y1="298" x2="600" y2="298"/></g>
<rect x="680" y="40" width="380" height="170" rx="10" fill="#fff" stroke="#455A64" stroke-width="2.5"/><path d="M680,90 h380 v-40 a10,10 0 0 0 -10,-10 h-360 a10,10 0 0 0 -10,10 z" fill="#455A64"/><text x="700" y="73" font-weight="bold" font-size="22" fill="#fff">settings</text>
<text x="700" y="130" font-weight="bold">PK</text><text x="760" y="130" font-weight="bold">key</text><text x="860" y="130">TEXT</text><text x="760" y="180">value</text><text x="860" y="180">TEXT</text><text x="940" y="180" fill="#555">NOT NULL</text><line x1="680" y1="148" x2="1060" y2="148" stroke="#CFD8DC"/>
<g font-size="17" fill="#555"><text x="680" y="250">Keys: goal_steps, goal_calories,</text><text x="680" y="275">goal_water, theme</text><text x="680" y="315">Added in schema version 2. The two tables</text><text x="680" y="340">are independent, so there is no foreign key.</text><text x="40" y="400">IX: idx_health_records_date. A day can have several rows; the dashboard adds them with SUM and GROUP BY date.</text></g>
</svg>

name: healthmate
description: "HealthMate - a personal health and wellness tracker."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  sqflite: ^2.4.2
  # runs the same sqflite code in a browser (SQLite compiled to WebAssembly)
  sqflite_common_ffi_web: ^1.0.0
  path: ^1.9.0
  intl: ^0.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # runs the same sqflite code in unit tests on the computer
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
